<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#58a6ff" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="0"/>
  
  <!-- Geometric decoration - grid dots -->
  <g opacity="0.12">
    <circle cx="50" cy="40" r="2" fill="#58a6ff"/>
    <circle cx="70" cy="40" r="2" fill="#58a6ff"/>
    <circle cx="90" cy="40" r="2" fill="#58a6ff"/>
    <circle cx="110" cy="40" r="2" fill="#58a6ff"/>
    <circle cx="130" cy="40" r="2" fill="#58a6ff"/>
    <circle cx="50" cy="55" r="2" fill="#58a6ff"/>
    <circle cx="70" cy="55" r="2" fill="#58a6ff"/>
    <circle cx="90" cy="55" r="2" fill="#58a6ff"/>
    <circle cx="110" cy="55" r="2" fill="#58a6ff"/>
    <circle cx="130" cy="55" r="2" fill="#58a6ff"/>
    <circle cx="50" cy="70" r="2" fill="#58a6ff"/>
    <circle cx="70" cy="70" r="2" fill="#58a6ff"/>
    <circle cx="90" cy="70" r="2" fill="#58a6ff"/>
    <circle cx="110" cy="70" r="2" fill="#58a6ff"/>
    <circle cx="130" cy="70" r="2" fill="#58a6ff"/>
  </g>
  
  <!-- Corner accent shapes -->
  <polygon points="900,0 900,120 780,0" fill="#58a6ff" opacity="0.08"/>
  <polygon points="900,0 900,80 820,0" fill="#58a6ff" opacity="0.12"/>
  <polygon points="0,300 0,220 100,300" fill="#3fb950" opacity="0.06"/>
  <polygon points="0,300 0,260 50,300" fill="#3fb950" opacity="0.1"/>
  
  <!-- Accent line left -->
  <rect x="48" y="85" width="4" height="130" rx="2" fill="url(#accent)"/>
  
  <!-- Glow circle behind name -->
  <ellipse cx="350" cy="140" rx="250" ry="80" fill="url(#glow)"/>
  
  <!-- Name -->
  <text x="68" y="130" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="42" fill="#ffffff" filter="url(#shadow)">Arbaz Ayub Khan</text>
  
  <!-- Role tags -->
  <!-- Tag 1: Engineering Manager -->
  <rect x="68" y="155" width="195" height="28" rx="6" fill="#238636" opacity="0.9"/>
  <text x="165" y="174" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">Engineering Manager</text>
  
  <!-- Tag 2: Lead Backend Engineer -->
  <rect x="273" y="155" width="195" height="28" rx="6" fill="#58a6ff" opacity="0.9"/>
  <text x="370" y="174" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">Lead Backend Engineer</text>
  
  <!-- Tag 3: Node.js & TypeScript -->
  <rect x="478" y="155" width="185" height="28" rx="6" fill="#30363d" opacity="0.9" stroke="#484f58" stroke-width="1"/>
  <text x="570" y="174" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Node.js &amp; TypeScript</text>
  
  <!-- Subtitle -->
  <text x="68" y="220" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="15" fill="#8b949e">Building scalable systems that handle millions of requests</text>
  <text x="68" y="245" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="15" fill="#8b949e">Leading 30+ engineers · Microservices · RabbitMQ · Mumbai, India</text>
  
  <!-- Bottom accent line -->
  <rect x="68" y="272" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Terminal prompt decoration (right side) -->
  <g transform="translate(640, 50)" opacity="0.5">
    <rect width="220" height="140" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="14" r="4" fill="#febc2e"/>
    <circle cx="44" cy="14" r="4" fill="#28c840"/>
    <text x="12" y="42" font-family="Courier New, monospace" font-size="10" fill="#58a6ff">$ kubectl get pods</text>
    <text x="12" y="58" font-family="Courier New, monospace" font-size="10" fill="#3fb950">✓ All systems running</text>
    <text x="12" y="78" font-family="Courier New, monospace" font-size="10" fill="#58a6ff">$ npm run deploy</text>
    <text x="12" y="94" font-family="Courier New, monospace" font-size="10" fill="#3fb950">✓ Deployed to prod</text>
    <text x="12" y="114" font-family="Courier New, monospace" font-size="10" fill="#58a6ff">$ rabbitmqctl status</text>
    <text x="12" y="130" font-family="Courier New, monospace" font-size="10" fill="#3fb950">✓ 2M+ msgs processed</text>
  </g>
</svg>
